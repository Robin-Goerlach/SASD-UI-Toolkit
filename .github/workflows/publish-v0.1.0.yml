name: Publish v0.1.0

# Publication is deliberately separated from normal CI. The release workflow is triggered only after
# the repository's full CI workflow completes on main, so a tag can never be created from a commit
# whose compiler, sanitizer, Release-install, or consumer validation is still pending.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    name: Publish validated v0.1.0
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the exact validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify v0.1.0 release markers
        shell: bash
        run: |
          set -euo pipefail

          expected_sha="${{ github.event.workflow_run.head_sha }}"
          actual_sha="$(git rev-parse HEAD)"

          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "ERROR: checkout SHA $actual_sha does not match validated CI SHA $expected_sha." >&2
            exit 1
          fi

          # Keep publication gated by source-controlled release metadata. If M3 later bumps the
          # project version or the changelog changes, this one-shot v0.1.0 publisher must not tag it.
          grep -Fq 'VERSION 0.1.0' CMakeLists.txt
          grep -Fq '## [0.1.0] - 2026-09-28' CHANGELOG.md
          test -f docs/en/V0_1_0_RELEASE_NOTES.md

      - name: Create or verify annotated v0.1.0 tag
        shell: bash
        run: |
          set -euo pipefail

          expected_sha="${{ github.event.workflow_run.head_sha }}"

          # A retry must be safe. If the tag already exists, require it to resolve to exactly the
          # validated commit rather than silently reusing or moving an unrelated release tag.
          if git rev-parse -q --verify 'refs/tags/v0.1.0' >/dev/null; then
            tagged_sha="$(git rev-list -n 1 v0.1.0)"
            if [[ "$tagged_sha" != "$expected_sha" ]]; then
              echo "ERROR: existing v0.1.0 resolves to $tagged_sha, expected $expected_sha." >&2
              exit 1
            fi
            echo "v0.1.0 already points at the validated commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v0.1.0 "$expected_sha" -m "SASD UI Toolkit v0.1.0"
            git push origin refs/tags/v0.1.0
          fi

      - name: Create GitHub Release if needed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view v0.1.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "GitHub Release v0.1.0 already exists."
          else
            gh release create v0.1.0 \
              --repo "${{ github.repository }}" \
              --verify-tag \
              --title "SASD UI Toolkit v0.1.0" \
              --notes-file docs/en/V0_1_0_RELEASE_NOTES.md
          fi
