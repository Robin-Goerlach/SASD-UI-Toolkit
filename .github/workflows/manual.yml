name: LaTeX User Manual

on:
  pull_request:
    paths:
      - 'docs/manual/**'
      - '.github/workflows/manual.yml'
  push:
    branches: [main]
    paths:
      - 'docs/manual/**'
      - '.github/workflows/manual.yml'

permissions:
  contents: read

jobs:
  german-manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaLaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-luatex texlive-latex-extra \
            texlive-lang-german texlive-fonts-recommended
      - name: Build German user manual
        run: make -C docs/manual pdf
      - name: Publish PDF build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sasd-ui-manual-de
          path: docs/manual/build/main.pdf
          if-no-files-found: error
