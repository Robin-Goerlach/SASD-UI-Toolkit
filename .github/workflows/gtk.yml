name: GTK Native CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gtk4:
    name: GTK4 Native Host
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GTK4/Xvfb dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev xvfb xauth fonts-dejavu-core

      - name: Configure
        run: >-
          cmake -S . -B build-gtk
          -DCMAKE_BUILD_TYPE=Debug
          -DSASD_UI_BUILD_TESTS=ON
          -DSASD_UI_BUILD_EXAMPLES=ON
          -DSASD_UI_WARNINGS_AS_ERRORS=ON
          -DSASD_UI_BUILD_GTK_ADAPTER=ON

      - name: Build
        run: cmake --build build-gtk --parallel

      - name: Test under Xvfb
        run: xvfb-run -a ctest --test-dir build-gtk --output-on-failure
