name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            compiler_args: -DCMAKE_CXX_COMPILER=g++
          - name: Linux Clang
            os: ubuntu-latest
            compiler_args: -DCMAKE_CXX_COMPILER=clang++
          - name: Windows MSVC
            os: windows-latest
            compiler_args: ""
          - name: macOS AppleClang
            os: macos-latest
            compiler_args: -DCMAKE_CXX_COMPILER=clang++

    steps:
      - uses: actions/checkout@v4

      - name: Validate POSIX smoke helper
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n tools/m2_smoke_posix.sh
          bash tools/m2_smoke_posix.sh --single-run --validate-only

      - name: Validate Windows smoke helpers
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Windows PowerShell 5.1 treats UTF-8-without-BOM scripts as ANSI. Keep both manual smoke
          # helpers ASCII-only so CI validates the script itself instead of an encoding accident.
          $helpers = @(
              "tools/m2_smoke_windows.ps1",
              "tools/m3_smoke_windows.ps1"
          )
          foreach ($helper in $helpers) {
              $bytes = [System.IO.File]::ReadAllBytes($helper)
              if ($bytes | Where-Object { $_ -gt 0x7F }) {
                  throw "$helper must remain ASCII-only for Windows PowerShell 5.1."
              }
          }
          .\tools\m2_smoke_windows.ps1 -SingleRun -ValidateOnly
          .\tools\m3_smoke_windows.ps1 -ValidateOnly

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DSASD_UI_BUILD_TESTS=ON
          -DSASD_UI_WARNINGS_AS_ERRORS=ON
          ${{ matrix.compiler_args }}

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Install CMake package
        run: cmake --install build --config Debug --prefix "${{ github.workspace }}/build/install"

      - name: Configure installed-package consumer
        run: >-
          cmake -S tests/package_consumer -B build-consumer
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/install"

      - name: Build installed-package consumer
        run: cmake --build build-consumer --config Debug --parallel

      - name: Test installed-package consumer
        run: ctest --test-dir build-consumer -C Debug --output-on-failure

  release-validation:
    name: ${{ matrix.name }}
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Release
            os: ubuntu-latest
            compiler_args: -DCMAKE_CXX_COMPILER=g++
          - name: macOS Release
            os: macos-latest
            compiler_args: -DCMAKE_CXX_COMPILER=clang++
          - name: Windows Release
            os: windows-latest
            compiler_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Verify repository release hygiene
        run: >-
          cmake
          -DSASD_UI_SOURCE_DIR="${{ github.workspace }}"
          -P tools/verify_release_tree.cmake

      - name: Configure Release
        run: >-
          cmake -S . -B build-release
          -DCMAKE_BUILD_TYPE=Release
          -DSASD_UI_BUILD_TESTS=ON
          -DSASD_UI_BUILD_EXAMPLES=ON
          -DSASD_UI_WARNINGS_AS_ERRORS=ON
          ${{ matrix.compiler_args }}

      - name: Build Release
        run: cmake --build build-release --config Release --parallel

      - name: Test Release
        run: ctest --test-dir build-release -C Release --output-on-failure

      - name: Install Release package
        run: >-
          cmake --install build-release
          --config Release
          --prefix "${{ github.workspace }}/release-stage"

      - name: Verify installed Release contents
        run: >-
          cmake
          -DSASD_UI_INSTALL_PREFIX="${{ github.workspace }}/release-stage"
          -P tools/verify_release_install.cmake

      - name: Configure Release consumer
        run: >-
          cmake -S tests/package_consumer -B build-release-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/release-stage"

      - name: Build Release consumer
        run: cmake --build build-release-consumer --config Release --parallel

      - name: Test Release consumer
        run: ctest --test-dir build-release-consumer -C Release --output-on-failure

  sdl3-adapter:
    name: Linux SDL3 adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL_ttf build dependencies and test font
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6-dev libharfbuzz-dev fonts-dejavu-core

      - name: Configure pinned SDL3 adapter
        run: >-
          cmake -S . -B build-sdl3
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DSASD_UI_BUILD_TESTS=ON
          -DSASD_UI_BUILD_EXAMPLES=ON
          -DSASD_UI_WARNINGS_AS_ERRORS=ON
          -DSASD_UI_BUILD_SDL3_ADAPTER=ON
          -DSASD_UI_FETCH_SDL3=ON
          -DSASD_UI_SDL3_TEST_FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          -DSDL_UNIX_CONSOLE_BUILD=ON
          -DBUILD_SHARED_LIBS:BOOL=ON

      - name: Verify SDL fetch preserves parent linkage policy
        run: |
          # Use an explicitly typed parent cache entry above. The regression we guard against is
          # SASD/SDL_ttf rewriting that caller-owned BOOL from ON to OFF via CACHE ... FORCE.
          cmake -N -LA build-sdl3 > build-sdl3-cache.txt
          grep -Fxq "BUILD_SHARED_LIBS:BOOL=ON" build-sdl3-cache.txt

      - name: Build SDL3 adapter tests and desktop demo
        run: cmake --build build-sdl3 --target sasd_ui_sdl3_tests sasd_ui_sdl3_demo --parallel

      - name: Test SDL3 adapter
        env:
          SDL_VIDEODRIVER: offscreen
        run: ctest --test-dir build-sdl3 -R sasd_ui_sdl3_tests --output-on-failure

  sanitizers:
    name: Linux Clang ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DSASD_UI_BUILD_TESTS=ON
          -DSASD_UI_WARNINGS_AS_ERRORS=ON
          -DSASD_UI_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build-sanitized --parallel

      - name: Test
        run: ctest --test-dir build-sanitized --output-on-failure
