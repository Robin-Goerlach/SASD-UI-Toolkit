name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            compiler_args: -DCMAKE_CXX_COMPILER=g++
          - name: Linux Clang
            os: ubuntu-latest
            compiler_args: -DCMAKE_CXX_COMPILER=clang++
          - name: Windows MSVC
            os: windows-latest
            compiler_args: ""
          - name: macOS AppleClang
            os: macos-latest
            compiler_args: -DCMAKE_CXX_COMPILER=clang++

    steps:
      - uses: actions/checkout@v4

      - name: Validate POSIX smoke helper
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n tools/m2_smoke_posix.sh
          bash tools/m2_smoke_posix.sh --single-run --validate-only

      - name: Validate Windows smoke helper
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Windows PowerShell 5.1 treats UTF-8-without-BOM scripts as ANSI. The smoke helper is
          # deliberately ASCII-only and constructs Unicode test text from code points at runtime.
          $bytes = [System.IO.File]::ReadAllBytes("tools/m2_smoke_windows.ps1")
          if ($bytes | Where-Object { $_ -gt 0x7F }) {
              throw "tools/m2_smoke_windows.ps1 must remain ASCII-only for Windows PowerShell 5.1."
          }
          .\tools\m2_smoke_windows.ps1 -SingleRun -ValidateOnly

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DSASD_UI_BUILD_TESTS=ON
          -DSASD_UI_WARNINGS_AS_ERRORS=ON
          ${{ matrix.compiler_args }}

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  sanitizers:
    name: Linux Clang ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DSASD_UI_BUILD_TESTS=ON
          -DSASD_UI_WARNINGS_AS_ERRORS=ON
          -DSASD_UI_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build-sanitized --parallel

      - name: Test
        run: ctest --test-dir build-sanitized --output-on-failure
