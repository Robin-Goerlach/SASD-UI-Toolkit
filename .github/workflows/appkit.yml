name: AppKit Native CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  appkit:
    name: macOS AppKit Native
    runs-on: macos-latest
    # Hosted arm64 runners can experience substantial capacity-related build slowdowns.
    # Keep a finite guard while allowing the established AppKit build and test gate to finish.
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure AppKit adapter
        run: >-
          cmake -S . -B build-appkit
          -DCMAKE_BUILD_TYPE=Debug
          -DSASD_UI_BUILD_TESTS=ON
          -DSASD_UI_BUILD_EXAMPLES=ON
          -DSASD_UI_WARNINGS_AS_ERRORS=ON
          -DSASD_UI_BUILD_APPKIT_ADAPTER=ON
      - name: Build AppKit adapter, tests and demo
        run: cmake --build build-appkit --config Debug --parallel
      - name: Test AppKit adapter
        run: ctest --test-dir build-appkit -C Debug -R 'sasd_ui_appkit_tests' --output-on-failure
